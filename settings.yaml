common:
  seed: 42
  prompt_dir: results/prompts
  answers_dir: results/answers
  judgements_dir: results/judgements
inference:
  temperature: 0
  model: google/gemma-3-12B-it
  base_url: http://localhost:8000/v1
  api_key: "@format {env[PLGRID_API_KEY]}"
  timeout: 200
judgement:
  temperature: 0
  resume: None
  model: deepseek-v4-pro
  base_url: https://api.deepseek.com
  api_key: "@format {env[DEEP_SEEK_KEY]}"
  timeout: 60
default:
  common:
    seed: 42
    prompt_dir: prompts
    answers_dir: answers
    judgements_dir: judgements
  inference:
    temperature: 0
    resume: null
  judgement:
    temperature: 0
    resume: null

local:
  prompt_preparation:
    num_questions: 100
  inference:
    model: SpeakLeash/bielik-4.5b-v3.0-instruct:Q8_0
    base_url: http://localhost:11434/v1
    api_key: ollama
    timeout: 60
  judgement:
    model: openai/gpt-oss-120b
    base_url: https://api.groq.com/openai/v1
    api_key: "@format {env[GROQ_API_KEY]}"
    timeout: 60

remote:
  prompt_preparation:
    num_questions: 10
  inference:
    model: speakleash/Bielik-11B-v3.0-Instruct
    base_url: https://llmlab.plgrid.pl/api/v1
    api_key: "@format {env[PLGRID_API_KEY]}"
    timeout: 120
  judgement:
    model: openai/gpt-oss-120b
    base_url: https://api.groq.com/openai/v1
    api_key: "@format {env[GROQ_API_KEY]}"
    timeout: 60